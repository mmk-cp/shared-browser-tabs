<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Browser</title><link rel="stylesheet" href="/static/css/app.css"></head>
<body class="dashboard"><header class="topbar"><div class="brand">◈ <span>Shared Browser</span></div><div class="user-area"><span id="user-name">{{ user.username }}</span><button id="logout" class="ghost">Log out</button></div></header>
<main class="browser-shell"><div class="browser-window"><div class="tab-strip"><div class="tab active"><span class="tab-dot"></span><span id="tab-title">Shared tab</span></div><span class="tab-plus">+</span></div><nav class="toolbar"><button data-action="back" title="Back">←</button><button data-action="forward" title="Forward">→</button><button data-action="reload" title="Reload">↻</button><form id="url-form"><span class="site-lock" aria-hidden="true">⌕</span><input id="url-input" type="url" placeholder="https://example.com" autocomplete="off"><button class="go" type="submit">Go</button></form></nav><div id="status" class="status">Connecting to your tab…</div><section id="viewport" class="viewport" tabindex="0"><canvas id="screen" aria-label="Live browser tab"></canvas><div id="empty" class="empty">Loading browser tab…</div></section></div></main><script src="/static/js/dashboard.js"></script></body></html>
